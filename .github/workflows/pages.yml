name: Publicar laboratorio no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verificar integridade dos arquivos publicados
        run: python checks/preflight.py
      - name: Preparar e verificar site estatico
        run: python checks/preparar_pages.py --output "$RUNNER_TEMP/nucleo-pages"
      - name: Instalar verificacao de navegador
        run: |
          python -m pip install "playwright>=1.40,<2"
          python -m playwright install --with-deps chromium
      - name: Testar laboratorio antes da publicacao
        run: python checks/verificar_site.py --diretorio "$RUNNER_TEMP/nucleo-pages" --output "$RUNNER_TEMP/site-pages.json"
      - name: Enviar site para implantacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/nucleo-pages
          retention-days: 1

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar laboratorio
        id: deployment
        uses: actions/deploy-pages@v4
