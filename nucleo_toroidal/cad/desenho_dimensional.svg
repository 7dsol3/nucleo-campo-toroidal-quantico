<text x="590" y="751" class="title">TOLERÂNCIAS E MONTAGEM</text>
<text x="590" y="783" class="">• Furos Ø3,4: conferir / acabar com broca após impressão.</text>
<text x="590" y="811" class="">• Peças impressas: alvo ±0,3; alturas dos tubos: alvo ±0,1.</text>
<text x="590" y="839" class="">• Medir o fio esmaltado real; recalcular se o isolamento exceder 1,1.</text>
<text x="590" y="867" class="">• Espaçadores e barras isolantes; não fechar anéis metálicos.</text>
<text x="590" y="895" class="">• Base: chapa isolante cortada e furada; bobina: mesa útil ≥226.</text>
<text x="590" y="923" class="">• 8 arruelas Ø6 × 0,5 e 8 porcas M3; aperto leve.</text>
<text x="590" y="951" class="">• Fios, conectores e proteção elétrica definidos no projeto de bancada.</text>
<text x="590" y="979" class="">• Roscas / filamento do cobre simplificados no modelo de visualização.</text>
