<text x="35" y="1052" class="">A coluna está aberta na extremidade superior e comunica com ar comum. Não aplicar vácuo ou pressão.</text>
<text x="35" y="1086" class="">Toroide: pilaresØ8×36,55 sobre tampa Z81, azimutes3,75°+90k; tocam a fita em Z117,55 entre espiras.</text>
<text x="35" y="1120" class="">Hardware comprado: nylonM5/M3. Para a imagem completa, ver OBJ colorido, scene.js e visualizador 3D.</text>
<text x="35" y="1154" class="">Malhas e desenhos não substituem inspeção, ensaios de aquecimento e avaliação mecânica da montagem física.</text>
