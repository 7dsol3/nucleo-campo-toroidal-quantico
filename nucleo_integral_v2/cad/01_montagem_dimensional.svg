<text x="35" y="1012" class="sub">TOLERÂNCIAS, MATERIAIS E LIMITES</text>
<text x="35" y="1045" class="tiny">Peças isolantes. Impressão: alvo ±0,3; espaçadores faceados: alvo ±0,1. Furos acabar com broca Ø5,5 / Ø3,4.</text>
<text x="35" y="1074" class="tiny">Tampas completas Ø340: mesa útil mínima Ø346 com brim3, recomendado≥350. Base: preferir chapa cortada/furada.</text>
<text x="35" y="1103" class="tiny">Carretéis Ø220: mesa útil mínimaØ226. Suporte removível sob flange superior; não imprimir com canal obstruído.</text>
<text x="35" y="1132" class="tiny">Confirmar diâmetro real do fio, resistência, isolamento e posições antes de energizar. Roscas e eletrônica são referências.</text>
<text x="35" y="1161" class="tiny">Validação digital: arestas fechadas/orientação/volume e folgas selecionadas. Sem certificação mecânica, térmica ou de pressão.</text>
